name: "django-boilerplate-devops"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "1"
    tag: "{{.Name}}"

services:
  loki:
    container_name: loki
    image: grafana/loki:3.1.1
    volumes:
      - ./bash/devops/loki/loki-config.yaml:/etc/loki/loki-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - devops-network
    logging: *default-logging
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  alloy:
    container_name: alloy
    image: grafana/alloy:v1.18.0
    volumes:
      - ./bash/devops/alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
      - tempo
    networks:
      - devops-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  tempo:
    container_name: tempo
    image: grafana/tempo:2.3.1
    volumes:
      - ./bash/devops/tempo/tempo-local.yaml:/etc/tempo-local.yaml
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo-local.yaml"]
    networks:
      - devops-network
    logging: *default-logging
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://localhost:3200/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  grafana:
    container_name: grafana
    image: grafana/grafana:11.1.0
    labels:
      logging: "promtail"
    volumes:
      - ./bash/devops/grafana/datasources/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./bash/devops/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting
      - grafana_data:/var/lib/grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-true}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=${GF_AUTH_DISABLE_LOGIN_FORM:-true}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
      - GRAFANA_ALERT_WEBHOOK_URL=${GRAFANA_ALERT_WEBHOOK_URL:-http://localhost:9999/grafana-alert-webhook-not-configured}
    # ports: # bật thủ công khi cần truy cập Grafana trực tiếp cho dev local (không qua nginx)
    #   - 3000:3000
    depends_on:
      - loki
      - tempo
      - prometheus
    networks:
      - devops-network
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:3000/api/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.13.1
    volumes:
      - ./bash/devops/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
    networks:
      - devops-network
    logging: *default-logging
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  postgres_exporter:
    container_name: postgres_exporter
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-django_user}:${POSTGRES_PASSWORD:-django_pass}@database:5432/${POSTGRES_DB:-databaselocal}?sslmode=disable
    networks:
      - devops-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  redis_exporter:
    container_name: redis_exporter
    image: oliver006/redis_exporter:v1.88.0
    environment:
      - REDIS_ADDR=redis://redis:6379
    networks:
      - devops-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"

  cadvisor:
    container_name: cadvisor
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - devops-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

networks:
  devops-network:
    name: devops-network

volumes:
  loki_data:
    name: loki_data
  tempo_data:
    name: tempo_data
  grafana_data:
    name: grafana_data
  prometheus_data:
    name: prometheus_data
