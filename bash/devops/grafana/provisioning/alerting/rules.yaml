apiVersion: 1

groups:
  - orgId: 1
    name: infra-targets
    folder: Infra Alerts
    interval: 1m
    rules:
      - uid: infra-target-down
        title: Target down
        condition: threshold
        data:
          - refId: query
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: up == 0
              instant: true
              range: false
              refId: query
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              refId: threshold
              expression: query
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: ["query"]
                  reducer:
                    type: last
        noDataState: NoData
        execErrState: Error
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} (job {{ $labels.job }}) is down"
