# Styled pages for the errors nginx answers itself, i.e. when Django is not
# reachable at all (container stopped, still booting, uwsgi wedged). Include this
# inside a server block; it needs the $error_page_file map from default.conf.
#
# Django's own responses are never touched: proxy_intercept_errors stays off, so
# a 503 from MaintenanceModeMiddleware keeps its rendered Unfold page and its
# Retry-After header.
# charset is set per location instead of server-wide: the charset module also
# rewrites proxied responses, which must keep whatever Django sent.
error_page 502 @error_502;
error_page 503 @error_503;
error_page 504 @error_504;

location @error_502 {
    charset utf-8;
    charset_types application/json;
    set $error_code 502;
    try_files $error_page_file =502;
}

location @error_503 {
    charset utf-8;
    charset_types application/json;
    set $error_code 503;
    try_files $error_page_file =503;
}

location @error_504 {
    charset utf-8;
    charset_types application/json;
    set $error_code 504;
    try_files $error_page_file =504;
}
