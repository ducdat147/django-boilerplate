# API clients get JSON, browsers get the HTML page. Both live in
# bash/devops/nginx/errors/ and are picked by extension, so nginx sets the right
# Content-Type on its own. The language prefix is optional: i18n_patterns only
# wraps the admin, the API is mounted flat under /api/.
map $uri $error_page_file {
    default          /50x.html;
    ~^/(vi/|en/)?api/  /50x.json;
}

upstream service_name {
    server server:8000;
}

upstream celery_flower {
    server celery_flower:5555;
}

upstream rabbitmq {
    server rabbitmq:15672;
}

upstream grafana {
    server grafana:3000;
}

server {
    listen 80;
    root /usr/share/nginx/errors;
    ssi on;
    # The JSON variant carries SSI markers too, which the default ssi_types
    # (text/html only) would leave untouched.
    ssi_types application/json;

    include /etc/nginx/snippets/error_pages.conf;

    location / {
        proxy_pass http://service_name;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        client_max_body_size 20M;
    }
}

server {
    listen 5555;
    root /usr/share/nginx/errors;
    ssi on;
    # The JSON variant carries SSI markers too, which the default ssi_types
    # (text/html only) would leave untouched.
    ssi_types application/json;

    include /etc/nginx/snippets/error_pages.conf;

    location / {
        proxy_pass http://celery_flower;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}

server {
    listen 15672;
    root /usr/share/nginx/errors;
    ssi on;
    # The JSON variant carries SSI markers too, which the default ssi_types
    # (text/html only) would leave untouched.
    ssi_types application/json;

    include /etc/nginx/snippets/error_pages.conf;

    location / {
        proxy_pass http://rabbitmq;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}

server {
    listen 3000;
    root /usr/share/nginx/errors;
    ssi on;
    # The JSON variant carries SSI markers too, which the default ssi_types
    # (text/html only) would leave untouched.
    ssi_types application/json;

    include /etc/nginx/snippets/error_pages.conf;

    location / {
        proxy_pass http://grafana;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}
