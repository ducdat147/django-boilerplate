    "django-money>=3.5.4",
    "django-phonenumber-field[phonenumbers]>=8.1.0",
    "django-simple-history>=3.10.1",
    "django-unfold>=0.66.0",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.28.0",
