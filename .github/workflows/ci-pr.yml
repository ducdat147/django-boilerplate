name: CI - Develop

on:
  pull_request:
    branches: [ "develop" ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: Django Tests with uv
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports: [ "5432:5432" ]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        options: >-
          --health-cmd="pg_isready -U postgres -d app_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd="redis-cli ping || exit 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      rabbitmq:
        image: rabbitmq:3.11
        ports: [ "5672:5672", "15672:15672" ]
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
      CACHE_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: configurations.settings
      CELERY_BROKER: amqp://guest:guest@localhost:5672//
      CELERY_BACKEND: rpc://
      CELERY_FLOWER_USER: admin
      CELERY_FLOWER_PASSWORD: admin
      PYTHONUNBUFFERED: 1
      DEPLOYMENT_ENVIRONMENT: test
      PROJECT_NAME: django
      EMAIL_USE_TLS: False
      EMAIL_USE_SSL: True
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 465
      EMAIL_HOST_USER: admin@mail.com
      EMAIL_HOST_PASSWORD: passmail
      EMAIL_VERIFICATION_CODE_TIMEOUT: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync

      - name: Run migrations
        run: uv run python manage.py migrate --noinput

      - name: Run tests with coverage
        run: uv run coverage run manage.py test

      - name: Report coverage
        run: uv run coverage report -m

  auto-merge:
    name: Auto-merge & delete branch
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Merge PR & delete branch
        run: gh pr merge ${{ github.event.pull_request.number }} --merge --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment merged
        run: gh pr comment ${{ github.event.pull_request.number }} --body "✅ Tests passed. Đã merge vào \`develop\` và xóa luôn branch gốc."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
