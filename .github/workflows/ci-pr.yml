name: CI - Develop

on:
  pull_request:
    branches: [ "develop" ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: Django Tests with uv
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports: [ "5432:5432" ]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        options: >-
          --health-cmd="pg_isready -U postgres -d app_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd="redis-cli ping || exit 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/app_test"
      CACHE_URL: "redis://localhost:6379/0"
      DJANGO_SETTINGS_MODULE: "configurations.settings"
      PYTHONUNBUFFERED: "1"
      DEPLOYMENT_ENVIRONMENT: "test"
      PROJECT_NAME: "django"
      EMAIL_USE_TLS: "${{ secrets.EMAIL_USE_TLS }}"
      EMAIL_USE_SSL: "${{ secrets.EMAIL_USE_SSL }}"
      EMAIL_HOST: "${{ secrets.EMAIL_HOST }}"
      EMAIL_PORT: "${{ secrets.EMAIL_PORT }}"
      EMAIL_HOST_USER: "${{ secrets.EMAIL_HOST_USER }}"
      EMAIL_HOST_PASSWORD: "${{ secrets.EMAIL_HOST_PASSWORD }}"
      EMAIL_VERIFICATION_CODE_TIMEOUT: "${{ secrets.EMAIL_VERIFICATION_CODE_TIMEOUT }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync

      - name: Run migrations
        run: uv run python manage.py migrate --noinput

      - name: Run tests with coverage
        run: uv run coverage run manage.py test

      - name: Report coverage
        run: uv run coverage report -m

  auto-merge:
    name: Auto-merge & delete branch
    runs-on: ubuntu-latest
    needs: [check-pr, test]
    if: ${{ needs.check-pr.outputs.hasConflicts == 'false' && success() && needs.check-pr.outputs.isFork == 'false' }}
    steps:
      - name: Merge PR & delete branch
        run: gh pr merge ${{ github.event.pull_request.number }} --merge --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment merged
        run: gh pr comment ${{ github.event.pull_request.number }} --body "✅ Tests passed. Đã merge vào \`develop\` và xóa luôn branch gốc."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
