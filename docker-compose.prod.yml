name: "django-boilerplate"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "1"
    tag: "{{.Name}}"

services:
  nginx:
    container_name: nginx
    image: nginx
    ports:
      - 80:80 # Nginx
      - 5555:5555 # Flower
      - 15672:15672 # RabbitMQ Management
      - 3000:3000 # Grafana
    volumes:
      - ./bash/devops/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./media:/app/media
    depends_on:
      - server
      - celery_flower
      - celery_beat
      - celery_worker
    networks:
      - local-networks
    logging: *default-logging

  server: &service
    container_name: server
    image: ducdat147/dj.base.project
    command: /start-service
    labels:
      logging: "promtail"
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
    env_file:
      - .docker.env
    networks:
      - local-networks
    depends_on:
      - database
      - redis
      - rabbitmq
      - grafana
    logging: *default-logging

  celery_worker:
    <<: *service
    container_name: celery_worker
    command: /start-celeryworker

  celery_beat:
    <<: *service
    container_name: celery_beat
    command: /start-celerybeat

  celery_flower:
    <<: *service
    container_name: celery_flower
    command: /start-celeryflower

  database:
    container_name: database
    image: postgres
    volumes:
      - database_data:/var/lib/postgresql/data
    env_file:
      - .docker.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local-networks

  redis:
    container_name: redis
    image: redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local-networks

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    env_file:
      - .docker.env
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local-networks

  loki:
    container_name: loki
    image: grafana/loki
    volumes:
      - ./bash/devops/loki/loki-config.yaml:/etc/loki/loki-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - local-networks
    logging: *default-logging
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  promtail:
    container_name: promtail
    image: grafana/promtail
    volumes:
      - ./bash/devops/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki
    networks:
      - local-networks
    logging: *default-logging
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://localhost:9080/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  tempo:
    container_name: tempo
    image: grafana/tempo
    volumes:
      - ./bash/devops/tempo/tempo-local.yaml:/etc/tempo-local.yaml
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo-local.yaml"]
    networks:
      - local-networks
    logging: *default-logging
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://localhost:3200/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  grafana:
    container_name: grafana
    image: grafana/grafana
    labels:
      logging: "promtail"
    volumes:
      - ./bash/devops/grafana/datasources/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - grafana_data:/var/lib/grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
    depends_on:
      - loki
      - tempo
    networks:
      - local-networks
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:3000/api/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

networks:
  local-networks:
    name: local-networks

volumes:
  rabbitmq_data:
    name: rabbitmq_data
  redis_data:
    name: redis_data
  database_data:
    name: database_data
  loki_data:
    name: loki_data
  tempo_data:
    name: tempo_data
  grafana_data:
    name: grafana_data
